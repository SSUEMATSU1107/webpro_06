<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規食事登録</title>
</head>
<body>
    <h1>新しい食事の記録</h1>
    <form action="/nutrition" method="POST">
        <p>食品名: <input type="text" name="food" placeholder="例: サラダチキン" required></p>
        <p>カロリー(kcal): <input type="number" name="calories" required></p>
        <p>タンパク質(g): <input type="number" step="0.1" name="protein" required></p>
        <input type="submit" value="登録">
    </form>
    <br>
    <a href="/nutrition">キャンセルして戻る</a>
</body>
</html>
